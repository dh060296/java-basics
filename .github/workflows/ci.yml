name: CI                      # Name, der auf GitHub angezeigt wird

on:                           # Wann soll das laufen?
  push:
    branches: [main]          # bei jedem Push auf main
  pull_request:               # und bei jedem Pull Request

jobs:
  build:
    runs-on: ubuntu-latest    # auf einem Linux-Server von GitHub
    steps:
      - uses: actions/checkout@v7      # Code herunterladen
      - uses: actions/setup-java@v5    # Java installieren
        with:
          distribution: temurin
          java-version: '25'
          cache: maven                 # braucht eine pom.xml im Repo!
      - run: chmod +x mvnw             # Sicherheitsnetz für Windows-Nutzer (siehe unten)
      - run: ./mvnw -B verify          # Bauen und alle Tests ausführen
