name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Alle Java-Dateien kompilieren
        run: |
          find . -name "*.java" > quellen.txt
          javac -d out @quellen.txt
